[package]
name = "dramlo-server"
version = "0.0.1"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
base64 = "0.22"
futures-util = { version = "0.3", default-features = false }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time", "process"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json", "multipart"] }
jsonschema = { version = "0.33", default-features = false }
